{% extends "base.html" %}

{% block title %}Edit Password{% endblock %}

{% block content %}
<div class="edit-form-card">
  <div class="edit-form-header">
    <h2>Change Password</h2>
    <p class="edit-subtext">Make it strong and secure</p>
  </div>

  <form method="POST" class="edit-form">
    <div class="form-group">
      <label for="password">New Password</label>
      <input type="password" id="password" name="password" placeholder="Enter new password" required minlength="6">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn-primary">Update Password</button>
      <a href="{{ url_for('main.edit_profile') }}" class="edit-cancel">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
