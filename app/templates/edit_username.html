{% extends "base.html" %}

{% block title %}Edit Username{% endblock %}

{% block content %}
<div class="edit-form-card">
  <div class="edit-form-header">
    <h2>Change Username</h2>
    <p class="edit-subtext">Pick something you’ll remember</p>
  </div>

  <form method="POST" class="edit-form">
    <div class="form-group">
      <label for="username">New Username</label>
      <input type="text" id="username" name="username" placeholder="Enter new username" required minlength="3">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn-primary">Update Username</button>
      <a href="{{ url_for('main.edit_profile') }}" class="btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
