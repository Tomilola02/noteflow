{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block nav %}{% endblock %} <!-- Hides the navbar -->

{% block content %}
<div class="auth-card">
  <div class="auth-header">
    <h1>Create Account</h1>
    <p>Start taking notes in seconds</p>
  </div>
  
  <form method="POST" class="auth-form">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Choose a username" required minlength="3">
    </div>
    
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Create a password" required minlength="6">
    </div>
    
    <button type="submit" class="btn-primary">Register</button>
  </form>
  
  <p class="auth-footer">Already have an account? 
    <a href="{{ url_for('auth.login') }}">Login here</a>
  </p>
</div>
{% endblock %}
