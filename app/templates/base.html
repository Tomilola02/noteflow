t<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}NoteHub{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
             <p class="flash">{{ msg }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <nav>
    {% block nav %}
    	<a href="{{ url_for('main.dashboard') }}">Dashboard</a>
		<a href="{{ url_for('notes.notes_r') }}">Notes</a>
		<a href="{{ url_for('auth.logout') }}">Logout</a>
    {% endblock %}
    </nav>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
